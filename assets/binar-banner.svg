<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Binar — in-app HTTP inspector for React Native">
  <defs>
    <linearGradient id="gleam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8EDF7"/>
      <stop offset="62%" stop-color="#E8EDF7"/>
      <stop offset="100%" stop-color="#FFB627"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFB627" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#FFB627" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="400" rx="20" fill="#0E1420"/>
  <circle cx="332" cy="168" r="170" fill="url(#halo)"/>

  <!-- Left column -->
  <text x="64" y="110" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="3.4" fill="#7C8AA5">BORNWORKS</text>
  <text x="64" y="196" font-family="ui-sans-serif, -apple-system, Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="88" font-weight="700" letter-spacing="-3" fill="url(#gleam)">binar</text>

  <!-- Signature: the gleam -->
  <path d="M0,-17 C2.2,-6.5 6.5,-2.2 17,0 C6.5,2.2 2.2,6.5 0,17 C-2.2,6.5 -6.5,2.2 -17,0 C-6.5,-2.2 -2.2,-6.5 0,-17 Z" transform="translate(332,166)" fill="#FFB627"/>

  <text x="64" y="238" font-family="ui-sans-serif, -apple-system, Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="19" fill="#A9B6CC">In-app HTTP inspector for React Native</text>

  <rect x="64" y="268" width="152" height="28" rx="14" fill="none" stroke="#253044"/>
  <text x="80" y="286" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#7C8AA5">zero native modules</text>
  <rect x="226" y="268" width="150" height="28" rx="14" fill="none" stroke="#253044"/>
  <text x="242" y="286" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#7C8AA5">fetch · axios · XHR</text>

  <!-- Inspector card -->
  <rect x="560" y="56" width="576" height="288" rx="16" fill="#161E2E" stroke="#253044"/>

  <text x="584" y="90" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="2.2" fill="#7C8AA5">NETWORK</text>
  <text x="1112" y="90" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#7C8AA5">4 calls</text>
  <line x1="560" y1="112" x2="1136" y2="112" stroke="#253044"/>

  <!-- Row 1 — 200 -->
  <rect x="584" y="118" width="54" height="22" rx="6" fill="#6BA5FF" fill-opacity="0.15"/>
  <text x="611" y="134" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" fill="#6BA5FF">GET</text>
  <text x="650" y="134" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#E8EDF7">/v1/orders?status=open</text>
  <text x="1030" y="134" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#3DD68C">200</text>
  <text x="1112" y="134" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#7C8AA5">128 ms</text>
  <rect x="650" y="146" width="62" height="3" rx="1.5" fill="#FFB627" fill-opacity="0.55"/>
  <line x1="584" y1="168" x2="1112" y2="168" stroke="#1E2739"/>

  <!-- Row 2 — 201 -->
  <rect x="584" y="174" width="54" height="22" rx="6" fill="#C58AF9" fill-opacity="0.15"/>
  <text x="611" y="190" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" fill="#C58AF9">POST</text>
  <text x="650" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#E8EDF7">/v1/auth/login</text>
  <text x="1030" y="190" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#3DD68C">201</text>
  <text x="1112" y="190" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#7C8AA5">342 ms</text>
  <rect x="650" y="202" width="158" height="3" rx="1.5" fill="#FFB627" fill-opacity="0.55"/>
  <line x1="584" y1="224" x2="1112" y2="224" stroke="#1E2739"/>

  <!-- Row 3 — 304 -->
  <rect x="584" y="230" width="54" height="22" rx="6" fill="#6BA5FF" fill-opacity="0.15"/>
  <text x="611" y="246" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" fill="#6BA5FF">GET</text>
  <text x="650" y="246" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#E8EDF7">/v1/products/8821</text>
  <text x="1030" y="246" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#6BA5FF">304</text>
  <text x="1112" y="246" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#7C8AA5">18 ms</text>
  <rect x="650" y="258" width="12" height="3" rx="1.5" fill="#FFB627" fill-opacity="0.55"/>
  <line x1="584" y1="280" x2="1112" y2="280" stroke="#1E2739"/>

  <!-- Row 4 — 500 -->
  <rect x="584" y="286" width="54" height="22" rx="6" fill="#C58AF9" fill-opacity="0.15"/>
  <text x="611" y="302" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" fill="#C58AF9">POST</text>
  <text x="650" y="302" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#E8EDF7">/v1/checkout/confirm</text>
  <text x="1030" y="302" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#FF6B6B">500</text>
  <text x="1112" y="302" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#7C8AA5">1.24 s</text>
  <rect x="650" y="314" width="346" height="3" rx="1.5" fill="#FF6B6B" fill-opacity="0.8"/>
</svg>
